<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Учёт коров — расширенный функционал</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#3d6eb5" />
  <!-- Стили: сборка Vite → dist/app.css (Tailwind + компоненты) -->
  <link rel="stylesheet" href="dist/app.css" />
</head>
<body>
  <datalist id="datalist-farm-bulls"></datalist>
  <datalist id="datalist-farm-technicians"></datalist>
  <datalist id="datalist-farm-drugs"></datalist>
  <div id="root"></div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <div id="offline-indicator" class="offline-indicator" role="status" aria-live="polite" aria-label="Нет подключения к интернету" hidden>📴 Нет подключения к интернету</div>
  <header id="app-header" class="app-header" aria-label="Шапка приложения">
    <button type="button" id="app-version-header" class="app-version-header app-version-header-btn" aria-label="Версия приложения. Нажмите для обновления или списка изменений."></button>
    <div class="app-header-actions">
      <div class="app-header-status-lamps">
        <button type="button" id="app-header-agent-btn" class="app-header-lamp-btn" hidden title="Агент" aria-label="Состояние агента">
          <span class="app-header-lamp-label" aria-hidden="true">А</span>
          <span id="connection-indicator-agent" class="connection-indicator connection-indicator--disconnected" role="status" aria-hidden="true"></span>
          <span id="app-header-agent-next" class="app-header-agent-next">—</span>
        </button>
        <button type="button" id="app-header-connection-btn" class="app-header-lamp-btn app-header-connection-btn" title="Настройки сервера: адрес, подключение/отключение" aria-label="Состояние подключения к серверу. Нажмите для перехода в настройки." onclick="typeof window.navigate === 'function' && window.navigate('sync')">
          <span class="app-header-lamp-label" aria-hidden="true">С</span>
          <span id="connection-indicator-global" class="connection-indicator connection-indicator--disconnected" role="status" aria-hidden="true"></span>
        </button>
      </div>
      <button type="button" id="app-header-reload-btn" class="app-header-reload-btn" tabindex="-1" title="Обновить страницу, если поля не нажимаются (как после открытия консоли). Черновики на экранах «Действия» не сохранятся. Не в цепочке Tab — чтобы после обхода DevTools фокус не залипал на этой кнопке." aria-label="Обновить страницу">Обновить</button>
    </div>
  </header>
  <!-- Шапка для печати (в стиле фирменного бланка МК «Генетика») -->
  <div id="print-header" class="print-header" aria-hidden="true">
    <div class="print-header-strip"></div>
    <div class="print-header-body">
      <div class="print-header-milk"></div>
      <div class="print-header-content">
        <div class="print-logo">
          <img src="icons/logo.png" alt="" width="120" height="64" class="print-logo-img" />
          <span class="print-company-name">Молочная компания «Генетика»</span>
        </div>
        <div class="print-details">
          <p>ООО Молочная компания «Генетика»</p>
          <p>603137, г. Нижний Новгород, ул. 40 лет Победы, д.&nbsp;17</p>
          <p>тел. 8 (831) 466 17 78, e-mail: info@mkg-nn.ru</p>
        </div>
      </div>
      <div class="print-doc-title" id="print-doc-title">Опись стада</div>
      <div class="print-doc-date" id="print-doc-date"></div>
    </div>
  </div>
