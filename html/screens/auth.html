  <!-- ========== Вход и регистрация (обязательно при запуске) ========== -->
  <div id="auth-screen" class="screen active">
    <h1>Вход</h1>
    <div id="auth-form-container" class="auth-form-container">
      <div class="auth-server-picker">
        <label for="authServerSelect">Выбрать сервер</label>
        <select id="authServerSelect" class="auth-server-select" aria-label="Выбрать сервер"></select>
        <p id="auth-server-display-name" class="auth-server-display-name">Генетика-НН</p>
        <p class="auth-api-hint auth-api-hint--short">Логин/пароль выдает администратор сервера</p>
        <div class="auth-centered-actions">
          <button type="button" class="action-btn" id="authRequestCredentialsBtn">Запросить логин/пароль</button>
        </div>
      </div>

      <!-- Локальный режим (без сервера): подключение по выбранному имени -->
      <div id="auth-local-block" class="auth-local-block">
        <div class="form-actions auth-local-actions auth-centered-actions">
          <button type="button" id="auth-connect-server-btn" class="action-btn" onclick="typeof window.connectToServer === 'function' && window.connectToServer()">Подключиться к серверу</button>
          <button type="button" id="auth-skip-btn" class="small-btn" onclick="typeof window.skipAuth === 'function' && window.skipAuth()">Войти без пароля</button>
        </div>
      </div>

      <!-- Серверный режим (API подключён) -->
      <div id="auth-server-block" style="display: none;">
        <p id="auth-session-status" class="auth-session-status auth-session-status--pending" hidden aria-live="polite"></p>
        <form id="authLoginForm" class="form" onsubmit="event.preventDefault(); if(typeof window.handleLogin==='function'){window.handleLogin(event);} return false;">
          <label for="authUsernameSelect">Выбрать пользователя</label>
          <select id="authUsernameSelect" class="auth-username-select" aria-label="Выбрать пользователя из списка">
            <option value="">— Выберите из списка —</option>
          </select>
          <label for="authUsername">Логин</label>
          <input type="text" id="authUsername" required autocomplete="username" />
          <label for="authPassword">Пароль</label>
          <input type="password" id="authPassword" autocomplete="current-password" required />
          <label class="auth-remember-password-label" for="authRememberPassword">
            <input type="checkbox" id="authRememberPassword" checked />
            Запомнить пароль
          </label>
          <div class="form-actions auth-login-actions">
            <button type="submit">Войти</button>
            <button type="button" id="authForgotPasswordBtn" class="small-btn">Забыл пароль</button>
            <button type="button" id="auth-register-switch-btn" onclick="typeof window.showAuthRegister === 'function' && window.showAuthRegister()">Регистрация</button>
          </div>
        </form>
        <form id="authRegisterForm" class="form" style="display: none;" onsubmit="event.preventDefault(); if(typeof window.handleRegister==='function'){window.handleRegister(event);} return false;">
          <label for="regUsername">Логин</label>
          <input type="text" id="regUsername" required autocomplete="username" />
          <span id="authUsernameCheck" class="auth-username-check" aria-live="polite"></span>
          <label for="regPassword">Пароль</label>
          <input type="password" id="regPassword" autocomplete="new-password" required />
          <label for="regRole">Роль</label>
          <select id="regRole">
            <option value="lite" selected>Lite</option>
            <option value="medium">Medium</option>
          </select>
          <p id="auth-register-bootstrap-hint" class="auth-api-hint" style="margin-top:8px;font-size:0.9em;opacity:0.9;">Первый пользователь на пустом сервере получает права администратора.</p>
          <div class="form-actions">
            <button type="submit">Зарегистрироваться</button>
            <button type="button" onclick="typeof window.showAuthLogin === 'function' && window.showAuthLogin()">Назад к входу</button>
          </div>
        </form>
        <p id="auth-user-data-hint" class="auth-user-data-hint">Логин и пароль запоминаются на этом телефоне, в том числе после обновления. После полной переустановки войдите ещё раз.</p>
      </div>
    </div>
  </div>
