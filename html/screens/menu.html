  <!-- ========== Меню (главный экран) ========== -->
  <div id="menu-screen" class="screen">
    <div class="menu-branding" aria-hidden="false">
      <img src="icons/logo.png" alt="Молочная компания Генетика" class="menu-branding-logo menu-branding-logo-full" width="120" height="64" />
      <span class="menu-branding-text">Молочная компания «Генетика»</span>
    </div>
    <p id="menu-user-session" class="menu-user-session" hidden></p>
    <p id="app-version" class="app-version" data-default-version="0.7.9" aria-label="Версия приложения"></p>
    <div id="menu-version-switcher" class="menu-version-switcher" hidden>
      <span class="menu-version-switcher-label">Версия:</span>
      <div class="menu-version-switcher-btns" role="group" aria-label="Переключение версии">
        <button type="button" class="menu-version-btn" data-preview-role="admin">Админ</button>
        <button type="button" class="menu-version-btn" data-preview-role="inseminator">Осеменатор</button>
        <button type="button" class="menu-version-btn" data-preview-role="service">Сервис</button>
      </div>
      <p id="menu-preview-banner" class="menu-preview-banner" hidden></p>
    </div>
    <h1>Меню</h1>

    <div id="menu-no-object-state" class="menu-no-object-state" hidden>
      <p id="menu-no-object-message" class="menu-no-object-message">Ожидается подключение объекта администратором.</p>
      <div class="menu-no-object-actions">
        <button type="button" class="action-btn menu-group-btn" id="menuCreateObjectEmptyBtn" style="display: none;" onclick="typeof window.handleAddObjectClick === 'function' && window.handleAddObjectClick()">
          <span class="ui-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg></span>
          <span>Создать базу</span>
        </button>
        <button type="button" class="action-btn menu-group-btn" id="menuSyncEmptyBtn" onclick="typeof window.navigate === 'function' && window.navigate('sync')">
          <span class="ui-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-15.5-6.4"/><path d="M3 4v5h5"/><path d="M3 12a9 9 0 0 0 15.5 6.4"/><path d="M21 20v-5h-5"/></svg></span>
          <span>Синхронизация</span>
        </button>
        <button type="button" class="action-btn menu-group-btn" id="menuLogoutEmptyBtn" onclick="typeof window.handleLogout === 'function' && window.handleLogout()">
          <span class="ui-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
          <span>Выход</span>
        </button>
      </div>
    </div>

    <div id="menu-main-content">
    <!-- Переключатель объектов (баз) -->
    <div id="object-switcher" class="object-switcher">
      <label for="currentObjectSelect">Объект:</label>
      <select id="currentObjectSelect" class="object-select" title="Выберите базу для работы"></select>
      <button type="button" class="small-btn" id="editObjectBtn" title="Изменить название базы" onclick="typeof window.handleEditObjectClick === 'function' && window.handleEditObjectClick()">Изменить</button>
      <button type="button" class="small-btn" id="deleteObjectBtn" title="Удалить базу" onclick="typeof window.handleDeleteObjectClick === 'function' && window.handleDeleteObjectClick()">Удалить</button>
      <button type="button" class="small-btn add-object-btn" id="addObjectBtn" title="Добавить новую базу" onclick="typeof window.handleAddObjectClick === 'function' && window.handleAddObjectClick()">+ Добавить объект</button>
    </div>

    <!-- Главное меню: только два входа -->
    <div class="action-buttons action-buttons--main-hub">
      <div class="menu-section">
        <button type="button" onclick="typeof window.navigate === 'function' && window.navigate('herd-hub')" class="action-btn menu-group-btn">
          <span class="ui-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="14" rx="7" ry="5"/><path d="M5 14c0-3 3-7 7-9 4 2 7 6 7 9"/><path d="M9 10.5c.5-1.5 1.5-2.5 3-2.5s2.5 1 3 2.5"/><circle cx="9.5" cy="14" r="0.8" fill="currentColor" stroke="none"/><circle cx="14.5" cy="14" r="0.8" fill="currentColor" stroke="none"/></svg></span>
          <span>Работа со стадом</span>
        </button>
      </div>
      <div class="menu-section" id="menu-section-farm-card">
        <button type="button" onclick="typeof window.navigate === 'function' && window.navigate('farm-card')" class="action-btn menu-group-btn">
          <span class="ui-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6M7 16h8"/></svg></span>
          <span>Карточка хозяйства</span>
        </button>
      </div>
    </div>
    </div><!-- #menu-main-content -->
  </div>
