  <!-- ========== Просмотр списка и карточка животного ========== -->
  <div id="view-screen" class="screen view-screen">
    <!-- Верхний блок: закреплён при прокрутке списка -->
    <div class="view-screen-header">
      <h1>Список всех животных</h1>
      <button type="button" class="small-btn" id="viewEditorModeBtn" title="Включить редактирование полей прямо в списке">✎ Режим редактора</button>
      <button type="button" class="small-btn" id="viewFieldsSettingsBtn">Настройка полей</button>
      <div id="search-filter-container" class="search-filter-container"></div>
      <div id="viewBulkActions" class="view-bulk-actions"></div>
    </div>
    <div id="viewEntriesList" class="view-entries-wrapper"></div>
    <button type="button" id="viewScrollToTopBtn" class="scroll-to-top-btn" aria-label="Вверх" style="display: none;">↑ Вверх</button>
    <button type="button" onclick="typeof window.navigateToParent === 'function' && window.navigateToParent()" class="back-button">Назад</button>
  </div>

  <!-- Экран просмотра карточки животного -->
  <div id="view-cow-screen" class="screen view-cow-screen">
    <div class="view-cow-header">
      <h1>Просмотр животного</h1>
    </div>
    <div id="viewCowCard" class="view-cow-body"></div>
    <button type="button" onclick="typeof window.viewCowBack === 'function' && window.viewCowBack()" class="back-button view-cow-back">Назад</button>
  </div>

  <!-- Экран «Все осеменения» -->
  <div id="all-inseminations-screen" class="screen">
    <div class="view-screen-header">
      <h1>Все осеменения</h1>
    </div>
    <div id="allInseminationsList" class="view-entries-wrapper" style="padding: 12px; overflow: auto;"></div>
    <button type="button" onclick="typeof window.navigateToParent === 'function' && window.navigateToParent()" class="back-button">Назад</button>
  </div>
